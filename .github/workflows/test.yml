name: test

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: npm pack --ignore-scripts
      - name: Verify installed release package
        run: |
          mkdir -p /tmp/docx-install-test
          npm install --prefix /tmp/docx-install-test "$PWD/$(ls qitao-chen-docx-templates-*.tgz)"
          node scripts/test-installed-package.cjs /tmp/docx-install-test/node_modules/@qitao-chen/docx-templates
